<details class="theme-customizer">
  <summary class="theme-trigger">
    <span class="ms-icon" aria-hidden="true">palette</span>
    <span>{{ 'theme.colors' | translate }}</span>
  </summary>

  <div class="theme-panel" [attr.aria-label]="'theme.colorCustomizer' | translate">
    <div class="theme-header">
      <span class="theme-title">{{ 'theme.colorTitle' | translate }}</span>
      <button
        type="button"
        class="theme-reset-all"
        [disabled]="!hasCustomizations()"
        (click)="resetColors()"
      >
        {{ 'theme.resetAll' | translate }}
      </button>
    </div>

    <div class="theme-list">
      @for (option of options; track option.value) {
        <label class="theme-field">
          <span class="theme-label">{{ colorLabel(option.value) }}</span>
          <input
            type="color"
            class="theme-input"
            [value]="colorValue(option.value)"
            [attr.aria-label]="'theme.colorLabel' | translate: { color: colorLabel(option.value) }"
            (input)="setColor(option.value, $event)"
          />
          <button
            type="button"
            class="theme-reset"
            [disabled]="!isCustomized(option.value)"
            [attr.aria-label]="'theme.resetColor' | translate: { color: colorLabel(option.value) }"
            (click)="resetColor(option.value)"
          >
            <span class="ms-icon" aria-hidden="true">restart_alt</span>
          </button>
        </label>
      }
    </div>
  </div>
</details>
